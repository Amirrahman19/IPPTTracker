[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ippt"
version = "0.1.0"
description = "Joint-centric, participant-calibrated IPPT push-up and sit-up assessment (MediaPipe pose, rule-based rep validation)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "tqdm",
    "mediapipe",
    "opencv-contrib-python<5",
]

[project.optional-dependencies]
data = ["kaggle", "requests", "truststore"]

[project.scripts]
ippt = "ippt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ippt.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
