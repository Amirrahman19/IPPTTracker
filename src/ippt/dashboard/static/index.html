<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPPT Live</title>
<style>
:root {
  --bg: #0a0a0f; --bg2: #12121a; --fg: #e8e8f0; --fg2: #888;
  --accent: #4fc3f7; --green: #66bb6a; --red: #ef5350; --amber: #ffca28;
  --card: #16161f; --border: #2a2a3a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: 'Segoe UI', system-ui, sans-serif;
       display: flex; flex-direction: column; }

/* ── top bar ── */
.top-bar { flex-shrink: 0; padding: 10px 24px; display: flex; align-items: center; gap: 12px;
           background: var(--card); border-bottom: 1px solid var(--border); }
.top-bar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
.pill.waiting { background: rgba(255,202,40,0.15); color: var(--amber); }
.pill.calibrating { background: rgba(79,195,247,0.15); color: var(--accent); }
.pill.counting { background: rgba(102,187,106,0.15); color: var(--green); }
.pill.disconnected { background: rgba(239,83,80,0.15); color: var(--red); }
.spacer { flex: 1; }
select, button { background: var(--bg2); color: var(--fg); border: 1px solid var(--border);
                 padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
button:hover { border-color: var(--accent); }

/* ── main area ── */
.main { flex: 1; display: flex; min-height: 0; }

/* ── skeleton area ── */
.skeleton-area { flex: 1; position: relative; background: #000; display: flex;
                 align-items: center; justify-content: center; min-width: 0; }
.skeleton-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.no-feed { position: relative; z-index: 1; color: var(--fg2); font-size: 16px;
           text-align: center; padding: 32px 24px; line-height: 1.8; }
.no-feed .url { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 22px;
                color: var(--accent); margin: 16px 0; user-select: all; }
.state-overlay { position: absolute; bottom: 24px; left: 24px; right: 24px; text-align: center;
                 font-size: 20px; font-weight: 600; color: var(--accent); z-index: 2;
                 text-shadow: 0 2px 12px rgba(0,0,0,0.9); pointer-events: none; }
.calib-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--accent);
             transition: width 0.2s; z-index: 2; }

/* ── right panel ── */
.right { width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
         background: var(--bg2); border-left: 1px solid var(--border);
         transition: width 0.25s, border-color 0.25s; overflow: hidden; }
.right.collapsed { width: 0; border-left-color: transparent; }

/* ── panel toggle ── */
.panel-toggle { position: absolute; top: 50%; right: 0; transform: translateY(-50%);
                z-index: 10; width: 24px; height: 48px; background: var(--card);
                border: 1px solid var(--border); border-right: none;
                border-radius: 6px 0 0 6px; cursor: pointer; display: flex;
                align-items: center; justify-content: center; color: var(--fg2);
                font-size: 12px; padding: 0; line-height: 1; }
.panel-toggle:hover { background: var(--bg2); color: var(--fg); }

/* ── counter ── */
.counter-section { padding: 32px 20px; text-align: center; flex-shrink: 0;
                   border-bottom: 1px solid var(--border); white-space: nowrap; }
.counter-num { font-size: 120px; font-weight: 900; line-height: 1; color: #fff;
               font-variant-numeric: tabular-nums; transition: color 0.15s; }
.counter-num.flash { color: var(--green); }
.counter-label { font-size: 13px; color: var(--fg2); text-transform: uppercase;
                 letter-spacing: 3px; margin-top: 4px; }
.counter-sub { font-size: 13px; color: var(--fg2); margin-top: 8px; }

/* ── signal graph ── */
.graph-section { flex: 1; padding: 16px; display: flex; flex-direction: column; min-height: 0; }
.graph-header { font-size: 13px; color: var(--fg2); margin-bottom: 8px; display: flex;
                justify-content: space-between; flex-shrink: 0; }
.graph-header .value { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.graph-wrap { flex: 1; position: relative; min-height: 80px; }
.graph-wrap canvas { width: 100%; height: 100%; }

/* ── bottom bar ── */
.bottom-bar { flex-shrink: 0; padding: 8px 24px; display: flex; align-items: center; gap: 12px;
              background: var(--card); border-top: 1px solid var(--border);
              font-size: 12px; color: var(--fg2); }

/* ── mobile ── */
@media (max-width: 700px) {
  .main { flex-direction: column; }
  .right { width: 100% !important; flex-shrink: 0; max-height: 220px;
           border-left: none; border-top: 1px solid var(--border); flex-direction: row; }
  .right.collapsed { max-height: 0; border-top-color: transparent; }
  .counter-section { flex: 1; padding: 12px; border-bottom: none; border-right: 1px solid var(--border); }
  .counter-num { font-size: 56px; }
  .graph-section { flex: 1; }
  .panel-toggle { top: auto; bottom: 8px; right: 8px; transform: none;
                  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>IPPT Live</h1>
  <span class="pill disconnected" id="statePill">Waiting</span>
  <span class="spacer"></span>
  <select id="exerciseSel">
    <option value="pushup" selected>Push-up</option>
    <option value="situp">Sit-up</option>
  </select>
  <button id="btnReset">Reset</button>
</div>

<div class="main">
  <div class="skeleton-area" id="skelArea">
    <canvas id="videoCanvas"></canvas>
    <canvas id="skelCanvas"></canvas>
    <div class="no-feed" id="noFeed">
      <div>Open on your phone:</div>
      <div class="url" id="cameraUrl">loading...</div>
      <div>Point the side-view camera at yourself,<br>then hold the starting position still.</div>
    </div>
    <div class="state-overlay" id="stateOverlay"></div>
    <div class="calib-bar" id="calibBar" style="width:0"></div>
    <button class="panel-toggle" id="panelToggle" title="Toggle panel">&#9664;</button>
  </div>

  <div class="right collapsed" id="rightPanel">
    <div class="counter-section">
      <div class="counter-num" id="counterNum">0</div>
      <div class="counter-label">Valid Reps</div>
      <div class="counter-sub" id="counterSub">Waiting for camera...</div>
    </div>
    <div class="graph-section">
      <div class="graph-header">
        <span id="signalLabel">Elbow Angle</span>
        <span class="value" id="signalValue">--</span>
      </div>
      <div class="graph-wrap">
        <canvas id="graphCanvas"></canvas>
      </div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span id="fpsDisplay">-- fps</span>
  <span class="spacer"></span>
  <span>IPPT Live Assessment</span>
</div>

<script>
const videoCanvas = document.getElementById('videoCanvas');
const videoCtx = videoCanvas.getContext('2d');
const skelCanvas = document.getElementById('skelCanvas');
const skelCtx = skelCanvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const graphCtx = graphCanvas.getContext('2d');
const counterNum = document.getElementById('counterNum');
const counterSub = document.getElementById('counterSub');
const statePill = document.getElementById('statePill');
const stateOverlay = document.getElementById('stateOverlay');
const calibBar = document.getElementById('calibBar');
const noFeed = document.getElementById('noFeed');
const cameraUrl = document.getElementById('cameraUrl');
const signalValue = document.getElementById('signalValue');
const signalLabel = document.getElementById('signalLabel');
const fpsDisplay = document.getElementById('fpsDisplay');
const exerciseSel = document.getElementById('exerciseSel');
const btnReset = document.getElementById('btnReset');
const panelToggle = document.getElementById('panelToggle');
const rightPanel = document.getElementById('rightPanel');

const JOINTS = [
  'nose','l_ear','r_ear','l_shoulder','r_shoulder','l_elbow','r_elbow',
  'l_wrist','r_wrist','l_pinky','r_pinky','l_index','r_index',
  'l_hip','r_hip','l_knee','r_knee','l_ankle','r_ankle',
  'l_heel','r_heel','l_toe','r_toe'
];
const BONES = [
  [3,5],[5,7],[4,6],[6,8],[3,4],[3,13],[4,14],[13,14],
  [13,15],[15,17],[14,16],[16,18],[17,19],[19,21],[18,20],[20,22],
];

let ws = null;
let hasData = false;
let frameCount = 0;
let lastFpsTime = performance.now();
let lastFpsCount = 0;
let signalHistory = [];

// Show camera URL — fetch the real LAN IP from the server
fetch('/api/status').then(r => r.json()).then(d => {
  if (d.camera_url) cameraUrl.textContent = d.camera_url;
  else cameraUrl.textContent = location.origin + '/camera';
}).catch(() => { cameraUrl.textContent = location.origin + '/camera'; });

// Panel toggle
panelToggle.addEventListener('click', () => {
  rightPanel.classList.toggle('collapsed');
  panelToggle.innerHTML = rightPanel.classList.contains('collapsed') ? '&#9664;' : '&#9654;';
});

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/display`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => updatePill('waiting');
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) drawVideoFrame(e.data);
    else { try { onFrame(JSON.parse(e.data)); } catch {} }
  };
  ws.onclose = () => { updatePill('disconnected'); setTimeout(connectWS, 2000); };
  ws.onerror = () => ws.close();
}

async function drawVideoFrame(buf) {
  let bmp;
  try {
    bmp = await createImageBitmap(new Blob([buf], { type: 'image/jpeg' }));
  } catch { return; }
  if (!hasData) {
    hasData = true;
    noFeed.style.display = 'none';
    rightPanel.classList.remove('collapsed');
    panelToggle.innerHTML = '&#9654;';
  }
  const area = document.getElementById('skelArea');
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth, h = area.clientHeight;
  videoCanvas.width = w * dpr;
  videoCanvas.height = h * dpr;
  videoCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  videoCtx.clearRect(0, 0, w, h);
  const scale = Math.max(w / bmp.width, h / bmp.height);
  const dw = bmp.width * scale, dh = bmp.height * scale;
  videoCtx.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
  bmp.close();
}

function updatePill(state) {
  statePill.className = 'pill ' + state;
  const labels = { waiting: 'Waiting', calibrating: 'Calibrating', counting: 'Counting', disconnected: 'No Camera' };
  statePill.textContent = labels[state] || state;
}

function onFrame(d) {
  if (!hasData) {
    hasData = true;
    noFeed.style.display = 'none';
    rightPanel.classList.remove('collapsed');
    panelToggle.innerHTML = '&#9654;';
  }

  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime > 1000) {
    fpsDisplay.textContent = `${frameCount - lastFpsCount} fps`;
    lastFpsCount = frameCount;
    lastFpsTime = now;
  }

  updatePill(d.state || 'waiting');

  if (d.message) stateOverlay.textContent = d.message;
  else if (d.state === 'counting') stateOverlay.textContent = '';

  if (d.calib_progress !== undefined) calibBar.style.width = (d.calib_progress * 100) + '%';
  else if (d.still_progress > 0) calibBar.style.width = (d.still_progress * 50) + '%';
  else calibBar.style.width = '0';

  const prev = parseInt(counterNum.textContent);
  counterNum.textContent = d.rep_count || 0;
  if (d.rep_count > prev) {
    counterNum.classList.add('flash');
    setTimeout(() => counterNum.classList.remove('flash'), 300);
  }

  if (d.state === 'waiting') counterSub.textContent = 'Hold starting position...';
  else if (d.state === 'calibrating') counterSub.textContent = 'Calibrating...';
  else if (d.state === 'counting') counterSub.textContent = d.counter_state === 'down' ? 'Going down...' : 'Ready';

  if (d.signal != null) signalValue.textContent = d.signal + '°';
  if (d.signal_history && d.signal_history.length > 0) signalHistory = d.signal_history;

  drawSkeleton(d.joints, d.side);
  drawGraph();
}

function drawSkeleton(joints, side) {
  const area = document.getElementById('skelArea');
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth, h = area.clientHeight;
  skelCanvas.width = w * dpr;
  skelCanvas.height = h * dpr;
  skelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  skelCtx.clearRect(0, 0, w, h);
  if (!joints || !joints.length) return;

  const pts = joints.map(j => j ? [j[0] * w, j[1] * h] : null);

  for (const [a, b] of BONES) {
    if (!pts[a] || !pts[b]) continue;
    const near = side && (JOINTS[a].startsWith(side + '_') || JOINTS[b].startsWith(side + '_'));
    skelCtx.strokeStyle = near ? 'rgba(79,195,247,0.9)' : 'rgba(255,255,255,0.25)';
    skelCtx.lineWidth = near ? 3 : 1.5;
    skelCtx.beginPath();
    skelCtx.moveTo(pts[a][0], pts[a][1]);
    skelCtx.lineTo(pts[b][0], pts[b][1]);
    skelCtx.stroke();
  }
  for (let i = 0; i < pts.length; i++) {
    if (!pts[i]) continue;
    const near = side && JOINTS[i].startsWith(side + '_');
    skelCtx.fillStyle = near ? '#4fc3f7' : 'rgba(255,255,255,0.3)';
    skelCtx.beginPath();
    skelCtx.arc(pts[i][0], pts[i][1], near ? 5 : 3, 0, Math.PI * 2);
    skelCtx.fill();
  }
}

function drawGraph() {
  const wrap = document.querySelector('.graph-wrap');
  if (!wrap) return;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w < 10 || h < 10) return;
  graphCanvas.width = w * dpr;
  graphCanvas.height = h * dpr;
  graphCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  graphCtx.clearRect(0, 0, w, h);

  if (signalHistory.length < 2) {
    graphCtx.fillStyle = '#444';
    graphCtx.font = '13px system-ui';
    graphCtx.textAlign = 'center';
    graphCtx.fillText('Signal will appear here', w / 2, h / 2);
    return;
  }

  const vals = signalHistory.map(p => p[1]);
  const times = signalHistory.map(p => p[0]);
  const mn = Math.min(...vals) - 10, mx = Math.max(...vals) + 10;
  const range = mx - mn || 1;
  const tMin = times[0], tMax = times[times.length - 1], tRange = tMax - tMin || 1;

  graphCtx.strokeStyle = '#1e1e2e'; graphCtx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = h * i / 4;
    graphCtx.beginPath(); graphCtx.moveTo(0, y); graphCtx.lineTo(w, y); graphCtx.stroke();
    graphCtx.fillStyle = '#555'; graphCtx.font = '10px system-ui'; graphCtx.textAlign = 'left';
    graphCtx.fillText((mx - range * i / 4).toFixed(0) + '°', 4, y - 3);
  }

  graphCtx.strokeStyle = '#4fc3f7'; graphCtx.lineWidth = 2; graphCtx.lineJoin = 'round';
  graphCtx.beginPath();
  for (let i = 0; i < signalHistory.length; i++) {
    const x = ((times[i] - tMin) / tRange) * w;
    const y = h - ((vals[i] - mn) / range) * h;
    if (i === 0) graphCtx.moveTo(x, y); else graphCtx.lineTo(x, y);
  }
  graphCtx.stroke();

  const lastY = h - ((vals[vals.length - 1] - mn) / range) * h;
  graphCtx.fillStyle = '#4fc3f7';
  graphCtx.beginPath(); graphCtx.arc(w, lastY, 4, 0, Math.PI * 2); graphCtx.fill();
}

exerciseSel.addEventListener('change', () => {
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ cmd: 'set_exercise', exercise: exerciseSel.value }));
  signalLabel.textContent = exerciseSel.value === 'pushup' ? 'Elbow Angle' : 'Torso Angle';
});

btnReset.addEventListener('click', () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cmd: 'reset' }));
  counterNum.textContent = '0';
  signalHistory = [];
  stateOverlay.textContent = '';
  calibBar.style.width = '0';
  counterSub.textContent = 'Hold starting position...';
});

connectWS();
</script>
</body>
</html>
